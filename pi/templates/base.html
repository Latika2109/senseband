<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SenseBand</title>
<style>
  body { font-family: system-ui, sans-serif; margin: 0; background: #f4f6f8; color: #1b2430; }
  main { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { margin: 0 0 12px; font-size: 22px; }
  .card { background: #fff; border-radius: 10px; padding: 14px; margin-bottom: 12px; box-shadow: 0 1px 3px #0002; }
  label { display: block; margin: 10px 0 4px; font-weight: 600; }
  input, select { width: 100%; padding: 8px; font-size: 16px; box-sizing: border-box; }
  button, .btn { display: inline-block; padding: 10px 16px; font-size: 16px; border: 0; border-radius: 8px;
                 background: #2563eb; color: #fff; cursor: pointer; text-decoration: none; margin-top: 12px; }
  ol li { margin: 8px 0; }
</style>
</head>
<body><main>{% block body %}{% endblock %}</main></body>
</html>
