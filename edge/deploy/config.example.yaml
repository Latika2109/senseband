# /etc/senseband/config.yaml - overrides edge/config/default.yaml (only put what you change here)
mode: hw
db_path: /var/lib/senseband/senseband.db

sms:
  provider: auto                      # Twilio when TWILIO_* are in /etc/senseband/senseband.env, SIM800L as backup
  contacts: ["+91XXXXXXXXXX"]        # emergency numbers WITH country code. The app's profile contacts take over once set.

logging:
  dir: /var/lib/senseband/logs

storage:
  recordings_dir: /var/lib/senseband/recordings
  keep_raw: false                     # true = rolling 7-day raw ECG/IMU on the band (more SD wear)

models:
  dir: /opt/senseband/current/ml/models

# cloud:
#   enabled: true
#   url: https://<project>.supabase.co/functions/v1
#   device_key: "<from register_device()>"

# ota:
#   enabled: true
#   manifest_url: https://example.org/senseband/manifest.json
#   public_key: "<base64 Ed25519 public key>"

# power:
#   ecg_duty_cycle: true               # see docs: slows collapse detection while the ECG is paused

bands:                                # ESP32 small bands over Wi-Fi
  primary: S1                         # drives SpO2 / pulse / battery / joint quaternion
  waist_imu_from: S1                  # use S1's raw IMU as the waist IMU (set "" if the Pi has its own MPU6050 on the waist)
